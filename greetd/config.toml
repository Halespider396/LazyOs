# ══════════════════════════════════════════════════════════════
# greetd config — LazyOS
# Uses hyprlock as the greeter
# ══════════════════════════════════════════════════════════════

[terminal]
vt = 1

[default_session]
command = "Hyprland"
user = "greeter"

[initial_session]
command = "Hyprland"
user = "greeter"
