# ══════════════════════════════════════════════════════════════
# hyprpaper.conf — LazyOS
# ══════════════════════════════════════════════════════════════

# Preload the wallpaper into memory
preload = ~/.config/hypr/wallpaper/lazyos.png

# Set it on all monitors
wallpaper = ,~/.config/hypr/wallpaper/lazyos.png

# Allow IPC (lets you change wallpaper on the fly with hyprctl)
ipc = on
