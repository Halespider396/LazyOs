# ══════════════════════════════════════════════════════════════
# Alacritty — LazyOS Nordic Palette
# ══════════════════════════════════════════════════════════════

[window]
padding = { x = 12, y = 10 }
decorations = "None"
opacity = 0.93
blur = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size   = 13.0

[colors.primary]
background = "#1a1e2e"
foreground = "#c0caf5"

[colors.cursor]
text   = "#1a1e2e"
cursor = "#7aa2f7"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[scrolling]
history = 5000

[bell]
duration = 0
