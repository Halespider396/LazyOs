# ══════════════════════════════════════════════════════════════
# hyprlock.conf — LazyOS
# Colors matched to wallpaper palette:
#   bg:        #0a1628  deep navy
#   mid:       #1a3a5c  steel blue
#   accent:    #7ab3d4  icy blue
#   highlight: #b8d4e8  light blue-white
#   white:     #e8f4ff  off-white
# ══════════════════════════════════════════════════════════════

background {
    monitor =
    path = ~/.config/hypr/wallpaper/lazyos.png
    blur_size = 7
    blur_passes = 3
    brightness = 0.6
    contrast = 1.0
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(7aa2f7aa)
    inner_color = rgba(1a1e2edd)
    font_color = rgba(c0caf5ff)

    fade_on_empty = true
    placeholder_text = <i>󰌾  password</i>
    hide_input = false

    check_color = rgba(7aa2f7ff)
    fail_color = rgba(c85050ff)
    fail_text = <i>󰟎  incorrect</i>
    capslock_color = rgba(f0c060ff)

    position = 0, -100
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(c0caf5f2)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B %Y'
    color = rgba(a9b1d6b3)
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 10
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =   $USER
    color = rgba(7aa2f7dd)
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, -60
    halign = center
    valign = center
}
